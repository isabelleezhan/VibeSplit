services:
  postgres:
    image: postgres:16
    container_name: vibesplit-postgres
    environment:
      POSTGRES_USER: vibesplit
      POSTGRES_PASSWORD: vibesplit
      POSTGRES_DB: vibesplit
    ports:
      - "5432:5432"
    volumes:
      - vibesplit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibesplit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vibesplit_pgdata:
